<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำสั่งซื้อของฉัน | เลิศรสโรตี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Prompt", sans-serif;
    }

    .gradient-header {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* เพิ่มสไตล์ให้เลข Order เด่นขึ้น */
    .order-number {
      font-family: monospace;
      letter-spacing: 0.05em;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-orange-50 to-amber-100 min-h-screen">

  <!-- Header -->
  <header class="gradient-header text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-3xl">📦</span>
        <div>
          <h1 class="text-xl font-bold">คำสั่งซื้อของฉัน</h1>
          <p class="text-xs opacity-90">เลิศรสโรตี</p>
        </div>
      </div>

      <nav class="flex items-center space-x-2">
        <a href="menu.html"
          class="bg-white text-red-700 px-4 py-2 rounded-full text-sm font-semibold hover:bg-red-50 transition">
          🏠 เมนู
        </a>
        <a href="cart.html" class="bg-white text-red-700 px-4 py-2 rounded-full text-sm font-semibold hover:bg-red-50 transition relative">
          🛒 ตะกร้า
          <span id="cartBadge" class="hidden absolute -top-2 -right-2 bg-yellow-400 text-red-700 text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center">0</span>
        </a>
        <a href="orders.html" class="bg-white text-red-700 px-4 py-2 rounded-full text-sm font-semibold hover:bg-red-50 transition">
          📦 คำสั่งซื้อ
        </a>
        <button id="logoutBtn"
          class="bg-yellow-400 text-red-700 px-4 py-2 rounded-full text-sm font-bold hover:bg-yellow-300 transition">
          🚪 ออกจากระบบ
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 py-8">
    <!-- Page Title -->
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-gray-800">ประวัติการสั่งซื้อ</h2>
      <p class="text-gray-600 text-sm mt-1">ติดตามสถานะคำสั่งซื้อของคุณได้ที่นี่</p>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="text-center py-20">
      <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-red-600 mx-auto mb-4"></div>
      <p class="text-gray-600 font-semibold">กำลังโหลดคำสั่งซื้อ...</p>
    </div>

    <!-- Orders List -->
    <div id="ordersList" class="hidden space-y-4">
      <!-- Orders will be rendered here -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden bg-white rounded-2xl shadow-lg p-12 text-center">
      <span class="text-6xl mb-4 block">📦</span>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">ยังไม่มีคำสั่งซื้อ</h2>
      <p class="text-gray-600 mb-6">เริ่มสั่งโรตีแสนอร่อยของเราได้เลย</p>
      <a href="menu.html"
        class="inline-block bg-red-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-red-700 transition">
        🍽️ ดูเมนู
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white py-6 mt-20">
    <div class="max-w-7xl mx-auto px-4 text-center text-sm">
      <p>📍 91 ถนนสิหราชเดโช ตำบลทะเลชุบศร อำเภอเมือง ลพบุรี</p>
      <p class="mt-2">☎ โทร 062-248-7887</p>
    </div>
  </footer>

  <script type="module">
    import { auth, getOrdersForUser, updateOrderStatus, logoutUser } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const ordersListEl = document.getElementById("ordersList");
    const loadingStateEl = document.getElementById("loadingState");
    const emptyStateEl = document.getElementById("emptyState");
    const logoutBtn = document.getElementById("logoutBtn");
    
    // Status color mapping
    const statusColors = {
      "รอตรวจสอบการชำระเงิน": "bg-yellow-100 text-yellow-800",
      "ชำระเงินแล้ว": "bg-blue-100 text-blue-800",
      "กำลังทำ": "bg-purple-100 text-purple-800",
      "ทำเสร็จแล้ว": "bg-green-100 text-green-800",
      "ยกเลิกคำสั่งซื้อแล้ว": "bg-red-100 text-red-800"
    };

    async function loadUserOrders(user) {
      loadingStateEl.classList.remove("hidden");
      ordersListEl.classList.add("hidden");
      emptyStateEl.classList.add("hidden");

      try {
        const orders = await getOrdersForUser(user.uid);

        loadingStateEl.classList.add("hidden");

        if (!orders || orders.length === 0) {
          emptyStateEl.classList.remove("hidden");
          return;
        }

        ordersListEl.classList.remove("hidden");
        ordersListEl.innerHTML = "";

        orders.forEach(order => {
          const orderCard = document.createElement("div");
          orderCard.className = "bg-white rounded-xl shadow-lg p-6";

          // Format date
          const dateStr = order.createdAt && order.createdAt.toDate
            ? order.createdAt.toDate().toLocaleString('th-TH', {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            })
            : "";

          // Status badge
          const statusClass = statusColors[order.status] || "bg-gray-100 text-gray-800";

          // Items list
          let itemsHTML = '<ul class="space-y-2 text-sm">';
          (order.items || []).forEach(item => {
            itemsHTML += `
              <li class="flex justify-between items-start">
                <span class="flex-1">
                  <span class="font-semibold">${item.name}</span> × ${item.qty}
                  ${item.note ? `<br><span class="text-xs text-gray-500">หมายเหตุ: ${item.note}</span>` : ''}
                </span>
                <span class="font-semibold text-red-600">${(item.price * item.qty).toLocaleString()} บาท</span>
              </li>
            `;
          });
          itemsHTML += '</ul>';

          // แก้ไขส่วนนี้: แสดงเลข Order ชัดเจน
          const orderNumberDisplay = order.orderNumber 
            ? `<span class="order-number text-2xl text-red-700">${order.orderNumber}</span>`
            : `<span class="text-gray-500">#${order.id.slice(-6)}</span>`;
          
          const orderRefDisplay = order.orderNumber 
            ? `<p class="text-xs text-gray-400 mt-1">รหัสอ้างอิง: #${order.id.slice(-6)}</p>`
            : '';

          orderCard.innerHTML = `
            <div class="flex justify-between items-start mb-4">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-sm text-gray-500">เลขคำสั่งซื้อ</span>
                  <span class="status-badge ${statusClass}">${order.status}</span>
                </div>
                <h3 class="font-bold text-gray-900">${orderNumberDisplay}</h3>
                ${orderRefDisplay}
                <p class="text-sm text-gray-600 mt-2">${dateStr}</p>
              </div>
              <div class="text-right">
                <span class="text-2xl font-bold text-red-600">${(order.total || 0).toLocaleString()} บาท</span>
                <p class="text-xs text-gray-500 mt-1">${order.items?.length || 0} รายการ</p>
              </div>
            </div>

            <div class="border-t border-gray-200 pt-4 mb-4">
              <details class="cursor-pointer">
                <summary class="font-semibold text-gray-700 hover:text-gray-900 select-none">
                  📋 รายการสินค้า (${order.items?.length || 0} รายการ)
                </summary>
                <div class="mt-3">
                  ${itemsHTML}
                </div>
              </details>
            </div>

            ${order.status !== 'ยกเลิกคำสั่งซื้อแล้ว' && order.status !== 'ทำเสร็จแล้ว' ? `
              <div class="mt-4 flex gap-2">
                <button 
                  class="cancelBtn flex-1 bg-red-100 hover:bg-red-200 text-red-700 py-2 rounded-lg font-semibold transition"
                  data-id="${order.id}"
                >
                  ❌ ยกเลิกคำสั่งซื้อ
                </button>
                ${order.status === 'รอตรวจสอบการชำระเงิน' ? `
                  <a 
                    href="checkout.html" 
                    class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold text-center transition"
                    onclick="localStorage.setItem('currentOrderId', '${order.id}')"
                  >
                    💳 ชำระเงิน
                  </a>
                ` : ''}
              </div>
            ` : ''}
          `;

          ordersListEl.appendChild(orderCard);
        });

        // Attach cancel handlers
        document.querySelectorAll(".cancelBtn").forEach(btn => {
          btn.onclick = async (e) => {
            const orderId = e.target.dataset.id;

            const confirmed = confirm(
              "⚠️ ยกเลิกคำสั่งซื้อ\n\n" +
              "คุณแน่ใจหรือไม่ที่จะยกเลิกคำสั่งซื้อนี้?\n" +
              "การดำเนินการนี้ไม่สามารถย้อนกลับได้"
            );

            if (!confirmed) return;

            e.target.disabled = true;
            e.target.textContent = "กำลังยกเลิก...";

            try {
              await updateOrderStatus(orderId, "ยกเลิกคำสั่งซื้อแล้ว");
              alert("✅ ยกเลิกคำสั่งซื้อเรียบร้อยแล้ว");
              loadUserOrders(auth.currentUser);
            } catch (err) {
              console.error(err);
              alert("❌ ไม่สามารถยกเลิกคำสั่งซื้อได้: " + err.message);
              e.target.disabled = false;
              e.target.textContent = "❌ ยกเลิกคำสั่งซื้อ";
            }
          };
        });

      } catch (err) {
        console.error(err);
        loadingStateEl.classList.add("hidden");

        // ตรวจสอบว่าเป็น error เรื่อง index หรือไม่
        if (err.message && err.message.includes('requires an index')) {
          ordersListEl.innerHTML = `
      <div class="bg-yellow-50 border-l-4 border-yellow-500 p-6 rounded-lg">
        <p class="text-yellow-800 font-bold text-lg mb-2">⚠️ ต้องสร้าง Database Index</p>
        <p class="text-yellow-700 mb-4">ระบบต้องการ Index เพื่อดึงข้อมูลคำสั่งซื้อ</p>
        <a href="https://console.firebase.google.com/v1/r/project/roti-25574/firestore/indexes" 
           target="_blank" 
           class="inline-block bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition">
          🔧 ไปสร้าง Index ที่ Firebase Console
        </a>
      </div>
    `;
        } else {
          ordersListEl.innerHTML = `
      <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-lg">
        <p class="text-red-700 font-semibold">❌ โหลดคำสั่งซื้อไม่สำเร็จ</p>
        <p class="text-sm text-red-600 mt-1">${err.message}</p>
      </div>
    `;
        }
      }
    }

    // Logout handler
    logoutBtn.onclick = async () => {
      if (!confirm("🤔 คุณต้องการออกจากระบบใช่หรือไม่?")) return;

      try {
        await logoutUser();
        alert("✅ ออกจากระบบเรียบร้อย");
        window.location.href = "index.html";
      } catch (err) {
        alert("❌ ออกจากระบบไม่สำเร็จ: " + err.message);
      }
    };

   

    // Auth check
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert("⚠️ กรุณาเข้าสู่ระบบก่อน");
        window.location.href = "index.html";
        return;
      }

      await loadUserOrders(user);
      
    });
  </script>
</body>

</html>
