<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการเมนู | แอดมิน - เลิศรสโรตี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Prompt", sans-serif; }
    .gradient-header {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="gradient-header text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">⚙️ จัดการเมนู (แอดมิน)</h1>
      </div>
      <a href="admin_menu.html" class="bg-white text-red-700 px-4 py-2 rounded-full text-sm font-bold hover:bg-red-50 transition">
        ← กลับหน้าจัดการคำสั่งซื้อ
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    
    <!-- เพิ่มเมนูใหม่ -->
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">➕ เพิ่มเมนูใหม่</h2>
      
      <form id="addMenuForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อเมนู *</label>
          <input type="text" id="menuName" required 
            class="w-full border-2 border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500"
            placeholder="เช่น โรตีกล้วยหอม">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ราคา (บาท) *</label>
          <input type="number" id="menuPrice" required min="1"
            class="w-full border-2 border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500"
            placeholder="เช่น 35">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">รูปภาพ</label>
          <input type="file" id="menuImage" accept="image/*"
            class="w-full border-2 border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500">
          <p class="text-xs text-gray-500 mt-1">รองรับไฟล์ JPG, PNG, GIF ขนาดไม่เกิน 32MB</p>
        </div>

        <!-- Preview รูป -->
        <div id="imagePreviewContainer" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-1">ตัวอย่างรูป</label>
          <img id="imagePreview" src="" alt="Preview" class="w-48 h-48 object-cover rounded-lg border-2 border-gray-300">
        </div>

        <!-- Progress Bar -->
        <div id="uploadProgress" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-1">กำลังอัพโหลด...</label>
          <div class="w-full bg-gray-200 rounded-full h-2.5">
            <div id="progressBar" class="bg-red-600 h-2.5 rounded-full" style="width: 0%"></div>
          </div>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-gradient-to-r from-red-600 to-red-700 text-white py-3 rounded-lg font-bold hover:from-red-700 hover:to-red-800 transition disabled:opacity-50 disabled:cursor-not-allowed">
          💾 บันทึกเมนู
        </button>
      </form>
    </div>

    <!-- รายการเมนูปัจจุบัน -->
    <div class="bg-white rounded-2xl shadow-lg p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">📋 เมนูทั้งหมด</h2>
      <div id="menuList">
        <p class="text-gray-500 text-center py-4">กำลังโหลด...</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { addMenuItemWithImage, getMenuItems, deleteMenuItem, auth, adminEmail } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const menuList = document.getElementById("menuList");
    const imageInput = document.getElementById("menuImage");
    const imagePreview = document.getElementById("imagePreview");
    const previewContainer = document.getElementById("imagePreviewContainer");

    // เช็คสิทธิ์แอดมิน
    onAuthStateChanged(auth, (user) => {
      if (!user || user.email !== adminEmail) {
        alert("⛔ ไม่มีสิทธิ์เข้าถึง - ต้องเป็นแอดมินเท่านั้น");
        window.location.href = "menu.html";
        return;
      }
      loadMenus();
    });

    // Preview รูปก่อนอัพโหลด
    imageInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        imagePreview.src = url;
        previewContainer.classList.remove("hidden");
      } else {
        previewContainer.classList.add("hidden");
      }
    };

    // เพิ่มเมนู
    document.getElementById("addMenuForm").onsubmit = async (e) => {
      e.preventDefault();
      
      const name = document.getElementById("menuName").value;
      const price = document.getElementById("menuPrice").value;
      const file = imageInput.files[0];
      const submitBtn = document.getElementById("submitBtn");
      const progressDiv = document.getElementById("uploadProgress");

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = "⏳ กำลังอัพโหลดรูป...";
        progressDiv.classList.remove("hidden");

        // จำลอง progress (เพราะ ImgBB ไม่มี realtime progress)
        let progress = 0;
        const progressInterval = setInterval(() => {
          progress += 10;
          if (progress <= 90) {
            document.getElementById("progressBar").style.width = progress + "%";
          }
        }, 200);

        // อัพโหลดไป ImgBB แล้วบันทึกลง Firestore
        await addMenuItemWithImage(name, price, file);
        
        clearInterval(progressInterval);
        document.getElementById("progressBar").style.width = "100%";

        alert("✅ เพิ่มเมนูสำเร็จ!");
        document.getElementById("addMenuForm").reset();
        previewContainer.classList.add("hidden");
        progressDiv.classList.add("hidden");
        document.getElementById("progressBar").style.width = "0%";
        
        loadMenus(); // โหลดรายการใหม่
        
      } catch (err) {
        alert("❌ ผิดพลาด: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "💾 บันทึกเมนู";
      }
    };

    // โหลดรายการเมนู
    async function loadMenus() {
      try {
        const menus = await getMenuItems();
        
        if (menus.length === 0) {
          menuList.innerHTML = "<p class='text-gray-500 text-center py-8'>ยังไม่มีเมนู</p>";
          return;
        }

        menuList.innerHTML = menus.map(item => `
          <div class="flex items-center justify-between border-b border-gray-200 py-4 last:border-0">
            <div class="flex items-center space-x-4">
              <img src="${item.imageUrl || 'https://via.placeholder.com/80?text=No+Image'}" 
                alt="${item.name}" 
                class="w-20 h-20 object-cover rounded-lg bg-gray-200"
                onerror="this.src='https://via.placeholder.com/80?text=Error'">
              <div>
                <h3 class="font-bold text-gray-800 text-lg">${item.name}</h3>
                <p class="text-red-600 font-bold text-xl">${item.price} บาท</p>
                ${item.imageUrl ? '<p class="text-xs text-green-600 mt-1">✓ มีรูปภาพ</p>' : '<p class="text-xs text-gray-400 mt-1">ไม่มีรูป</p>'}
              </div>
            </div>
            <button onclick="deleteMenu('${item.id}')" 
              class="bg-red-100 text-red-600 px-4 py-2 rounded-lg hover:bg-red-200 transition font-semibold flex items-center space-x-1">
              <span>🗑️</span>
              <span>ลบ</span>
            </button>
          </div>
        `).join("");
        
      } catch (err) {
        menuList.innerHTML = `<p class="text-red-500 text-center py-4">โหลดไม่สำเร็จ: ${err.message}</p>`;
      }
    }

    // ลบเมนู
    window.deleteMenu = async (id) => {
      if (!confirm("⚠️ ต้องการลบเมนูนี้ใช่หรือไม่? การกระทำนี้ไม่สามารถย้อนกลับได้")) return;
      
      try {
        await deleteMenuItem(id);
        alert("✅ ลบสำเร็จ");
        loadMenus();
      } catch (err) {
        alert("❌ ลบไม่สำเร็จ: " + err.message);
      }
    };
  </script>
</body>
</html>
