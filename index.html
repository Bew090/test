<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เลิศรสโรตี | สมัครสมาชิก / เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Prompt", sans-serif; }
    .gradient-bg {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-amber-50 to-red-50 min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Logo & Header -->
  <div class="text-center mb-8">
    <div class="w-24 h-24 mx-auto mb-4 bg-red-600 rounded-full flex items-center justify-center shadow-2xl">
      <span class="text-5xl">🥐</span>
    </div>
    <h1 class="text-4xl font-bold text-red-700 mb-2">เลิศรสโรตี</h1>
    <p class="text-gray-600">โรตีสดใหม่ทุกวัน อร่อยทุกคำ</p>
  </div>

  <!-- Login/Register Form -->
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">สมัครสมาชิก / เข้าสู่ระบบ</h2>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">อีเมล</label>
        <input 
          id="email" 
          type="email" 
          placeholder="your@email.com"
          class="w-full border-2 border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">รหัสผ่าน</label>
        <input 
          id="password" 
          type="password" 
          placeholder="••••••••"
          class="w-full border-2 border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition"
        >
      </div>
    </div>

    <div class="mt-6 space-y-3">
      <button 
        id="loginBtn"
        class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:shadow-lg transition transform hover:scale-[1.02]"
      >
        🔓 เข้าสู่ระบบ
      </button>

      <button 
        id="registerBtn"
        class="w-full border-2 border-red-600 text-red-600 py-3 rounded-lg font-semibold hover:bg-red-50 transition"
      >
        ✨ สมัครสมาชิก
      </button>
    </div>

    <div class="mt-6 text-center text-sm text-gray-500">
      <p>เข้าสู่ระบบเพื่อสั่งซื้อโรตีแสนอร่อย</p>
    </div>
  </div>

  <!-- Footer Info -->
  <div class="mt-8 text-center text-sm text-gray-600">
    <p class="font-semibold">📍 ร้านเลิศรสโรตี</p>
    <p>หน้าโรงเรียนเทศบาล 3</p>
    <p>91 ถนนสิหราชเดโช ตำบลทะเลชุบศร อำเภอเมือง ลพบุรี</p>
    <p class="mt-2">☎ โทร 062-248-7887</p>
  </div>

  <script type="module">
    import { loginUser, registerUser, auth, adminEmail } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");

    function goAfterAuth(email) {
      if (email && email.toLowerCase() === (adminEmail || "").toLowerCase()) {
        window.location.href = "admin.html";
      } else {
        window.location.href = "menu.html";
      }
    }

    loginBtn.onclick = async () => {
      const email = emailEl.value.trim();
      const pw = passwordEl.value;
      
      if (!email || !pw) {
        alert("⚠️ กรุณากรอกอีเมลและรหัสผ่าน");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "กำลังเข้าสู่ระบบ...";

      try {
        const userCredential = await loginUser(email, pw);
        alert("✅ เข้าสู่ระบบสำเร็จ!");
        goAfterAuth(userCredential.user.email);
      } catch (err) {
        console.error(err);
        let errorMsg = "เข้าสู่ระบบไม่สำเร็จ";
        if (err.code === "auth/user-not-found") {
          errorMsg = "ไม่พบผู้ใช้นี้ในระบบ";
        } else if (err.code === "auth/wrong-password") {
          errorMsg = "รหัสผ่านไม่ถูกต้อง";
        } else if (err.code === "auth/invalid-email") {
          errorMsg = "รูปแบบอีเมลไม่ถูกต้อง";
        }
        alert("❌ " + errorMsg);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "🔓 เข้าสู่ระบบ";
      }
    };

    registerBtn.onclick = async () => {
      const email = emailEl.value.trim();
      const pw = passwordEl.value;
      
      if (!email || !pw) {
        alert("⚠️ กรุณากรอกอีเมลและรหัสผ่าน");
        return;
      }

      if (pw.length < 6) {
        alert("⚠️ รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = "กำลังสมัครสมาชิก...";

      try {
        const userCredential = await registerUser(email, pw);
        alert("✅ สมัครสมาชิกสำเร็จ!");
        goAfterAuth(userCredential.user.email);
      } catch (err) {
        console.error(err);
        let errorMsg = "สมัครสมาชิกไม่สำเร็จ";
        if (err.code === "auth/email-already-in-use") {
          errorMsg = "อีเมลนี้ถูกใช้งานแล้ว";
        } else if (err.code === "auth/invalid-email") {
          errorMsg = "รูปแบบอีเมลไม่ถูกต้อง";
        } else if (err.code === "auth/weak-password") {
          errorMsg = "รหัสผ่านไม่ปลอดภัยพอ";
        }
        alert("❌ " + errorMsg);
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = "✨ สมัครสมาชิก";
      }
    };

    // Enter key support
    passwordEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter") loginBtn.click();
    });

    // Auto redirect if already logged in
    onAuthStateChanged(auth, user => {
      if (user) {
        goAfterAuth(user.email);
      }
    });
  </script>
</body>
</html>
